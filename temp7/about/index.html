<div id="content"><article class="wrap page"><img class="full" src="/temp7/media/mark.jpg" alt="网格上的四簇白绒" style="max-height:480px;object-fit:contain;background:#141414"><h1>网格上的四簇绒</h1><p>七锦敏团做企业形象、专业设计和能上线的页面，也做技术和界面：软硬件怎么被看见，搬运装备的人怎么少看一眼说明书。</p><p>这一版标志是严格网格上的四团白绒，细线把它们连起来，其中一团带一点薄荷。没有字母，没有数字七。</p><p>它来自博美的毛，但读起来应该像一张施工图。</p><p>上海七锦敏团广告有限公司<br>Seven Mint Creative<br><a href="mailto:hello@sevenmintcreative.com">hello@sevenmintcreative.com</a></p></article></div><script src="/temp7/assets/site.js"></script>
