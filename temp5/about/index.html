<div id="content"><article class="sheet"><img class="full" src="/temp5/media/mark.jpg" alt="两根高笔画中间的一点白绒" style="max-height:360px;object-fit:contain;background:#f5f5f5"><h1>字与字之间夹着一点绒</h1><p class="deck">七锦敏团的这一面像编辑部。我们做图文、信息咨询和企业怎么对自己人说话。咨询不含需要许可的那一类。</p><p class="deck">标志是两根很高的笔画，中间卡住一点白毛，像排字车间里的饰件。不读成任何字母，更不是阿拉伯数字。</p><p class="deck">白博美只提供这个绒点。杂志不需要一只狗。</p><p>上海七锦敏团广告有限公司<br>Seven Mint Creative<br><a class="more" href="mailto:hello@sevenmintcreative.com">hello@sevenmintcreative.com</a></p></article></div>
