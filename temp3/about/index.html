<div id="content"><div class="widepic"><img src="/temp3/media/mark.jpg" alt="细黑线上的一簇白毛"></div><section class="sheet ash"><div class="inner"><h1>一条线，上面一簇毛</h1><p>公司在上海。做广告设计与制作，也做会议和展览。出国办展会另按规定审批。</p><p>标志是一条很细的黑线，线上停着一小团白博美的毛。没有数字，没有脸。远看像地平线。</p><p>这一套只放空间里的工作：馆、牌、发布会、展台。</p><p>上海七锦敏团广告有限公司<br>Seven Mint Creative<br><a href="mailto:hello@sevenmintcreative.com">hello@sevenmintcreative.com</a></p></div></section></div><footer>sevenmintcreative.com</footer><script src="/temp3/assets/site.js"></script>
